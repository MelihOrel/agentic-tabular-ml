[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atml"
version = "0.1.0"
description = "Agentic tabular ML platform: validated data loading, guarded cleaning, AutoML and a ReAct agent on top."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Melih Can Orel" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "plotly>=5.18"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
agent = ["langchain>=0.2", "langchain-openai>=0.1", "python-dotenv>=1.0"]
explain = ["shap>=0.44"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "app", "api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
